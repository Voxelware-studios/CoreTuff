name: Bug Report
description: Report a bug or unexpected behaviour in CoreTuff
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        ## CoreTuff Bug Report

        Thank you for helping improve CoreTuff!

        CoreTuff is an open-source project. This issue tracker is
        intended for reporting bugs and unexpected behaviour.

        Before submitting:
        - Search existing issues to avoid duplicates.
        - Make sure you are using a supported version.
        - Provide enough information to reproduce the issue.
        - Remove sensitive information from logs and configurations.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - Core
        - Addon
        - API
        - Dashboard
        - Web Editor
        - Integration
        - Configuration
        - Database
        - Other
    validations:
      required: true

  - type: input
    id: addon
    attributes:
      label: Addon Name
      description: If the issue involves an addon, provide its name.
      placeholder: ExampleAddon

  - type: textarea
    id: bug
    attributes:
      label: Bug Description
      description: Clearly describe the bug you encountered.
      placeholder: |
        Describe what happened and why you believe it is a bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide exact steps to reproduce the issue.
      placeholder: |
        1. Start the server.
        2. Execute a command.
        3. Perform an action.
        4. Observe the issue.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
      placeholder: Describe the expected behaviour.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What happened instead?
      placeholder: Describe the actual behaviour.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Videos
      description: Attach screenshots or videos if they help demonstrate the issue.
      placeholder: Drag and drop files here.

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Messages
      description: Include relevant console output, exceptions or stack traces.
      placeholder: |
        Paste relevant logs here...
      render: text

  - type: markdown
    attributes:
      value: |
        ## Environment Information

  - type: input
    id: version
    attributes:
      label: CoreTuff Version
      description: Which version of CoreTuff are you running?
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: mcversion
    attributes:
      label: Minecraft Version
      description: Which Minecraft version are you using?
      placeholder: "Example: 1.21.11"
    validations:
      required: true

  - type: dropdown
    id: server
    attributes:
      label: Server Software
      description: Which server software are you using?
      options:
        - Paper
        - Folia
        - Purpur
        - Spigot
        - Other
    validations:
      required: true

  - type: input
    id: java
    attributes:
      label: Java Version
      description: Which Java version is installed?
      placeholder: "Example: Java 25"

  - type: input
    id: os
    attributes:
      label: Operating System
      description: Which operating system is your server running?
      placeholder: "Example: Ubuntu 24.04 LTS"

  - type: textarea
    id: configuration
    attributes:
      label: Relevant Configuration
      description: Include relevant configuration sections if applicable. Remove passwords, tokens and other sensitive information.
      placeholder: |
        Paste relevant configuration here...
      render: yaml

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Anything else that might help investigate this issue?
      placeholder: Additional information...